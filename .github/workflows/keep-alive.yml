# Keep the F1 App Service loaded on a schedule. Always On is not available on Free.
#
# Single schedule: Saturday and Sunday, every 10 minutes, 06:00–16:50 UTC.
# That is 16:00–02:50 AEST (covers 4:50pm–2:50am Sydney). During AEDT: 17:00–03:50.
# The 06:50 UTC tick (16:50 AEST) also hits /health/ready to resume SQL once.
#
# Optional GitHub Actions variable: APP_URL (no trailing slash).
# Defaults to https://score-burrow-app-dev.azurewebsites.net

name: Keep alive

on:
  schedule:
    - cron: "*/10 6-16 * * 6,0"
  workflow_dispatch:
    inputs:
      warm_database:
        description: Also hit /health/ready (resumes Azure SQL)
        type: boolean
        default: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping App Service
        env:
          APP_URL: ${{ vars.APP_URL }}
          EVENT_NAME: ${{ github.event_name }}
          WARM_DATABASE: ${{ github.event.inputs.warm_database }}
        run: |
          set -euo pipefail
          base="${APP_URL:-https://score-burrow-app-dev.azurewebsites.net}"
          base="${base%/}"
          path="/health"
          timeout=90
          utc_hm="$(date -u +%H%M)"
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$WARM_DATABASE" = "true" ]; then
            path="/health/ready"
            timeout=120
          elif [ "$utc_hm" = "0650" ]; then
            path="/health/ready"
            timeout=120
          fi
          echo "GET ${base}${path}"
          curl -fsS --retry 2 --retry-delay 15 --max-time "$timeout" "${base}${path}"
          echo
